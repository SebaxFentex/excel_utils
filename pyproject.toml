[project]
name = "excel"
version = "0.1.3"
description = "Libreria para automatizar libros de Excel y consultas Power Query con xlwings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
	"xlwings>=0.30.0",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["excel"]
