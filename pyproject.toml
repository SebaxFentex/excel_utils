[project]
name = "excel"
version = "0.2.1"
description = "Automatizacion de libros de Excel y consultas Power Query con xlwings"
readme = "README.md"
authors = [
    { name = "Sebastián Fuentes", email = "sebastianfuentesab@gmail.com" },
]
requires-python = ">=3.14"
dependencies = [
    "xlwings==0.37.8",
]

[dependency-groups]
dev = [
    "ipykernel==7.1.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<1.0"]
build-backend = "uv_build"
