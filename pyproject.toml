[project]
name = "excel_utils"
version = "0.4.0"
description = "Automatizacion de libros de Excel y consultas Power Query con xlwings"
readme = "README.md"
authors = [
    { name = "Sebastián Fuentes", email = "sebastianfuentesab@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "xlwings==0.37.8",
    "log_utils",
]

[dependency-groups]
dev = [
    "ipykernel==7.4.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<1.0"]
build-backend = "uv_build"

[tool.uv.sources]
log_utils = { git = "https://github.com/SebaxFentex/log_utils", tag = "v0.1.0" }
